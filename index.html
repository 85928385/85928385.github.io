<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darthz's Repo</title>
    <!-- FontAwesome for crisp icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-hover-bg: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-glow: #6366f1;
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            background-image: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientMove 18s ease infinite;
            color: var(--text-main);
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient background glow elements */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #4f46e5;
            top: 10%;
            left: 15%;
            animation: floatOrb1 12s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #9333ea;
            bottom: 10%;
            right: 15%;
            animation: floatOrb2 15s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -60px) scale(1.15); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 32px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 35px 70px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
        }

        /* Header / Title Section */
        .header {
            text-align: center;
        }

        .title {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 70%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 10px 20px rgba(99, 102, 241, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: #a5b4fc;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Clock & Date Widget Card */
        .time-widget {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .time-widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
        }

        .clock-display {
            font-size: 48px;
            font-weight: 700;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .clock-display span.seconds {
            font-size: 28px;
            color: var(--accent-cyan);
            font-weight: 400;
            margin-left: 2px;
        }

        .date-display {
            font-size: 15px;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .date-display i {
            color: var(--accent-cyan);
        }

        /* Quick Search Bar */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(15, 23, 42, 0.7);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .search-input:focus + .search-icon {
            color: var(--accent-glow);
        }

        /* Nav Section / Links Grid */
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--accent-purple);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover-bg);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.4);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            flex-shrink: 0;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .link-card:hover .icon-box {
            transform: scale(1.1);
        }

        /* Unique Accent Colors for Icons */
        .icon-github { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .fa-mobile-screen-button { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); }
        .fa-microchip { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); }
        .icon-tools { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .icon-plus { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .link-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-desc {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-icon {
            margin-left: auto;
            font-size: 12px;
            color: #64748b;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(3px);
            color: #fff;
        }

        /* Footer Section */
        .footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #fff;
        }

        /* Responsive Layout adjustments */
        @media (max-width: 580px) {
            .container {
                padding: 30px 20px;
                gap: 24px;
            }

            .title {
                font-size: 30px;
            }

            .clock-display {
                font-size: 38px;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }

            .footer {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">Darthz's Repo</h1>
            <div class="badge">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>
        </header>

        <!-- Time & Date Widget -->
        <div class="time-widget">
            <div class="clock-display" id="clock">00:00<span class="seconds">:00</span></div>
            <div class="date-display">
                <i class="fa-regular fa-calendar-days"></i>
                <span id="date">2026年08月17日 星期一</span>
            </div>
        </div>

        <!-- Quick Search Bar -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索 Google 或输入 URL..." onkeydown="handleSearch(event)">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>

        <!-- Links Grid -->
        <main>

            </div>
            
            <div class="links-grid">
                <!-- 链接 1: GitHub -->
                <a href="https://github.com" target="_blank" class="link-card">

                    </div>
                    <div class="link-info">
                        <div class="link-name">GitHub</div>
                        <div class="link-desc">代码托管平台‌</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <!-- 预留链接 2 -->
                <a href="https://85928385.github.io/totally-not-spyware-v2/" target="_blank" class="link-card">
                    <div class="fa-solid fa-mobile-screen-button">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">iOS12-JB</div>
                        <div class="link-desc">IOS-12的网页越狱</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <!-- 预留链接 3 -->
                <a href="https://85928385.github.io/pixl.js-web/" target="_blank" class="link-card">
                    <div class="fa-solid fa-microchip">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">pixl.js-web</div>
                        <div class="link-desc">pixl.js的网页管理和刷机</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <!-- 预留链接 4 -->
                <a href="#" target="_blank" class="link-card">
                    <div class="icon-box icon-tools">
                        <i class="fa-solid fa-toolbox"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">预留链接 03</div>
                        <div class="link-desc">点击配置新站点</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <!-- 预留链接 5 -->
                <a href="#" target="_blank" class="link-card">
                    <div class="icon-box icon-plus">
                        <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">预留链接 04</div>
                        <div class="link-desc">点击配置新站点</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <!-- 预留链接 6 -->
                <a href="#" target="_blank" class="link-card">
                    <div class="icon-box icon-plus">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <div class="link-info">
                        <div class="link-name">预留链接 05</div>
                        <div class="link-desc">点击配置新站点</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <span>&copy; <span id="year"></span> Darthz's Repo</span>
            <span>Powered by GitHub Pages</span>
        </footer>
    </div>

    <!-- Live Clock Script & Search Functionality -->
    <script>
        function updateClock() {
            const now = new Date();
            
            // Hours, Minutes, Seconds
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').innerHTML = `${hours}:${minutes}<span class="seconds">:${seconds}</span>`;

            // Date with custom formatting
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = weekDays[now.getDay()];

            document.getElementById('date').innerText = `${year}年${month}月${date}日 ${dayName}`;
            document.getElementById('year').innerText = year;
        }

        // Initialize clock and update every second
        updateClock();
        setInterval(updateClock, 1000);

        // Search bar enter key trigger
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                if (query) {
                    if (query.startsWith('http://') || query.startsWith('https://')) {
                        window.open(query, '_blank');
                    } else {
                        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                    }
                }
            }
        }
    </script>
</body>
</html>
